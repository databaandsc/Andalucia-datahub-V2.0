services:
  db:
    image: postgres:16
    container_name: datahub_db
    environment:
      # Variables de entorno para configurar la base de datos PostgreSQL
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD_RAW}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: datahub_api
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      # Construimos la URL usando las variables seguras y apuntamos a 'db'
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD_ENCODED}@db:5432/${DB_NAME}

  # Añadimos el nuevo servicio de Flyway justo aquí, alineado con db y api
  flyway:
    image: flyway/flyway:10-alpine
    container_name: datahub_flyway
    depends_on:
      - db
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${DB_NAME}
      FLYWAY_USER: ${DB_USER}
      FLYWAY_PASSWORD: ${DB_PASSWORD_RAW}
    volumes:
      - ./sql:/flyway/sql
    command: migrate

# OJO: Esta etiqueta de volumes va al final del todo, pegada al borde izquierdo
volumes:
  postgres_data: